name: Release

# Tag a commit as vX.Y.Z (e.g. `git tag v1.0.0 && git push --tags`) to build a signed
# release APK and publish it as a GitHub Release with auto-generated notes.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (X.Y.Z) — used when running manually'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION (code $CODE)"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            echo "KEYSTORE_FILE=release.jks" >> "$GITHUB_ENV"
            echo "Using release keystore"
          else
            echo "::warning::KEYSTORE_BASE64 secret is not set — APK will be signed with the debug key"
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PversionName=${{ steps.ver.outputs.name }} \
            -PversionCode=${{ steps.ver.outputs.code }}

      - name: Package artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/tvsas-${{ steps.ver.outputs.name }}.apk"
          cp app/build/outputs/mapping/release/mapping.txt "dist/mapping-${{ steps.ver.outputs.name }}.txt"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: TVsas ${{ steps.ver.outputs.name }}
          generate_release_notes: true
          files: |
            dist/tvsas-${{ steps.ver.outputs.name }}.apk
            dist/SHA256SUMS.txt
            dist/mapping-${{ steps.ver.outputs.name }}.txt

      - name: Clean up key
        if: always()
        run: rm -f release.jks
